name: Apply Exact UI

on:
  push:
    branches:
      - fix/exact-pre-refactor-ui

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exact-pre-refactor-ui
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/apply-exact-ui.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "Exact UI migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/editor/workbench/canonical-editor-workbench.tsx app/editor/panels/editor-management-panels.tsx
          git commit -m "Wire canonical editor to exact pre-refactor shell"
          git push origin HEAD:fix/exact-pre-refactor-ui
