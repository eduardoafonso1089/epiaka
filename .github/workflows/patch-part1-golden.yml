name: Patch Part 1 Golden

on:
  push:
    branches:
      - refactor/editor-architecture

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/editor-architecture
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch cross-branch golden generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/part1-audit-fixes.yml')
          s=p.read_text()
          old="""  if(value&&typeof value==='object') return Object.fromEntries(Object.entries(value).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>[k,round(v)]));"""
          new="""  if(value&&typeof value==='object') return Object.fromEntries(Object.entries(value).filter(([,v])=>v!==undefined).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>[k,round(v)]));"""
          if old not in s: raise SystemExit('round normalizer not found')
          s=s.replace(old,new,1)
          old="""          const stripVersion=(doc)=>{ const clone=structuredClone(doc); if(clone.info) delete clone.info.version; return round(clone); };"""
          new="""          const normalizeCocoForParity=(doc)=>{\n            const clone=structuredClone(doc);\n            if(clone.info) delete clone.info.version;\n            for(const ann of clone.annotations??[]){\n              if((ann.num_keypoints??0)>0){ delete ann.bbox; delete ann.area; }\n            }\n            return round(clone);\n          };"""
          if old not in s: raise SystemExit('stripVersion normalizer not found')
          s=s.replace(old,new,1)
          s=s.replace("assert.deepEqual(stripVersion(refactor.coco),stripVersion(main.coco),'COCO demo golden diverged beyond explicitly tracked info.version');","assert.deepEqual(normalizeCocoForParity(refactor.coco),normalizeCocoForParity(main.coco),'COCO demo golden diverged beyond explicitly tracked differences');",1)
          marker='''  "project.manifest.version": {'''
          block='''  "coco.point_bbox_area": {\n    "main": "legacy 8-unit point marker scaled from normalized annotation space",\n    "refactor": "fixed 8-source-pixel keypoint bbox with area 0",\n    "reason": "The keypoint coordinate is equivalent, but auxiliary bbox/area semantics changed when the normalized annotation space was removed. This remains an explicit COCO compatibility decision rather than being silently normalized in production."\n  },\n  "project.manifest.version": {'''
          if marker not in s: raise SystemExit('justification insertion point not found')
          s=s.replace(marker,block,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/part1-audit-fixes.yml
          git commit -m "test(export): normalize serialized COCO golden semantics"
          git push origin HEAD:refactor/editor-architecture
