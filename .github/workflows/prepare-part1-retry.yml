name: Prepare Part 1 Retry

on:
  push:
    branches:
      - refactor/editor-architecture

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/editor-architecture
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make demo toolbar invocation event-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/editor/workbench/canonical-editor-workbench.tsx')
          s=p.read_text()
          old='<button onClick={loadDemo} disabled={loading}>Demo</button>'
          new='<button onClick={() => void loadDemo()} disabled={loading}>Demo</button>'
          if old not in s:
            raise SystemExit('demo toolbar button not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/editor/workbench/canonical-editor-workbench.tsx
          git commit -m "fix(editor): make demo toolbar invocation event-safe"
          git push origin HEAD:refactor/editor-architecture
