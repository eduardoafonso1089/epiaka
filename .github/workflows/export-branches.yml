name: Export Branches

on:
  push:
    branches:
      - refactor/editor-architecture

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: bundle/main
          persist-credentials: false

      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/editor-architecture
          path: bundle/refactor-editor-architecture
          persist-credentials: false

      - name: Remove Git metadata
        run: rm -rf bundle/main/.git bundle/refactor-editor-architecture/.git

      - name: Upload combined branch archive
        uses: actions/upload-artifact@v4
        with:
          name: poligome-main-and-refactor
          path: bundle
          if-no-files-found: error
          compression-level: 6
