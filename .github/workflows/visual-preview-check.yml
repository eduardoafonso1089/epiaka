name: Visual Preview Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  screenshot:
    if: github.head_ref == 'fix/true-premerge-visual-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile preview
        env:
          PREVIEW_URL: https://fix-true-premerge-visual-parity-poligome.eduardoafonso1089.workers.dev
        run: |
          cat > capture-preview.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const base = process.env.PREVIEW_URL;
          const browser = await chromium.launch({ headless: true });
          await fs.mkdir('visual-preview', { recursive: true });

          async function capture(name, viewport) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const response = await page.goto(`${base}/annotate`, { waitUntil: 'networkidle', timeout: 90000 });
            if (!response || !response.ok()) throw new Error(`${name}: preview HTTP ${response?.status()}`);

            const demo = page.getByRole('button', { name: /demo/i }).first();
            if (await demo.count()) {
              try {
                await demo.click({ timeout: 5000 });
                await page.waitForTimeout(1800);
              } catch {}
            }

            await page.screenshot({ path: `visual-preview/${name}.png`, fullPage: false });
            await context.close();
          }

          await capture('desktop-1440x900', { width: 1440, height: 900 });
          await capture('mobile-390x844', { width: 390, height: 844 });
          await browser.close();
          EOF
          node capture-preview.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview-screenshots
          path: visual-preview/*.png
          retention-days: 1
