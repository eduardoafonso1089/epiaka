name: Editor Refactor

on:
  push:
    branches:
      - refactor/editor-architecture
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build verified app
        run: npm run build

      - name: Run tests
        run: node --import tsx --test tests/*.test.mjs

      - name: Report COG tile benchmark
        run: COG_BENCH_ITERATIONS=5000 npm run benchmark:cog
