name: Fix Exact UI Types

on:
  push:
    branches: [fix/exact-pre-refactor-ui]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exact-pre-refactor-ui
      - name: Make disabled legacy controls type-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/editor/presentation/pre-refactor-chrome.tsx')
          s = p.read_text()
          s = s.replace('  onClick: () => void;\n  children: ReactNode;', '  onClick?: () => void;\n  children: ReactNode;', 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/editor/presentation/pre-refactor-chrome.tsx
          git commit -m "Make legacy disabled controls type-safe"
          git push origin HEAD:fix/exact-pre-refactor-ui
